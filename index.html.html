<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midal Cables – Workshop Info Screen</title>
<style>
:root{--blue:#1d1ba0;--tint:#e8eaff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden;cursor:none}
#hd{position:fixed;top:0;left:0;right:0;height:12vh;background:#fff;border-bottom:.7vh solid var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 3vw;z-index:5}
#hd img{height:9.5vh}
#clock{color:var(--blue);font-size:2.8vh;font-weight:600;text-align:right}
#stage{position:absolute;inset:12.7vh 0 0 0}
.s{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4vh 6vw 6vh;opacity:0;transition:opacity .9s,transform .9s}
.s.on{opacity:1;transform:none!important}
.fx0{transform:translateX(6vw)}.fx1{transform:scale(.94)}.fx2{transform:translateY(5vh)}
.th0{background:#fff;color:var(--blue)}
.th1{background:var(--blue);color:#fff}
.th2{background:var(--tint);color:#14137a}
.tag{font-size:3vh;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.75;margin-bottom:3vh}
.hi{font-size:5vh;line-height:1.35;margin-top:2.5vh;opacity:.85;max-width:88vw;font-family:"Nirmala UI","Mangal","Noto Sans Devanagari","Segoe UI",Arial,sans-serif}
.en{font-size:6.6vh;font-weight:800;line-height:1.2;max-width:88vw}
.ar{font-size:5.4vh;line-height:1.35;margin-top:2.5vh;opacity:.85;max-width:88vw}
.qm{font-size:18vh;line-height:.6;opacity:.35;font-family:Georgia,serif}
.by{font-size:3.8vh;margin-top:4vh;opacity:.8;font-style:italic}
.s.q .en{font-weight:600;font-style:italic;font-size:6vh}
ul{list-style:none;margin:3vh 0 0;padding:0;display:grid;gap:2vh;max-width:90vw}
li{font-size:4.2vh;font-weight:600;padding:1.8vh 2.5vw;border-radius:1.2vh;background:#ffffff22;border-left:1vh solid currentColor;text-align:left}
.th0 li,.th2 li{background:#1d1ba014}
li small{display:block;font-size:3vh;font-weight:400;opacity:.8;text-align:right}
li small.h{text-align:left;font-family:"Nirmala UI","Mangal","Noto Sans Devanagari","Segoe UI",Arial,sans-serif}
.s.p img{max-height:62vh;max-width:88vw;border-radius:1.5vh;box-shadow:0 1vh 4vh #0006}
.s.p .by{font-style:normal}
#bar{position:fixed;bottom:0;left:0;height:.9vh;background:#ffb400;width:0;z-index:6}
#hint{position:fixed;bottom:1.6vh;right:2vw;font-size:1.8vh;color:#8a8ab5;z-index:6}
</style>
</head>

var stage=document.getElementById("stage"),bar=document.getElementById("bar");
var pool=[],photos=[],queue=[],qi=0,th=0,paused=false,t0=Date.now(),curEl=null,count=0;
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function rebuildPool(){
  pool=D.map(function(d){return{k:"m",c:d[0],en:d[1],ar:d[2],hi:d[3]}})
   .concat(Q.map(function(q){return{k:"q",en:q[0],ar:q[1],by:q[2],hi:q[3]}}))
   .concat(photos.map(function(p){return{k:"p",src:p.src,by:p.name}}));
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function makeQueue(){
  var a=shuffle(pool.slice()),out=[];
  a.forEach(function(x,i){if(i%PIN_EVERY===0)out.push({k:"a"});out.push(x)});
  queue=out;qi=0;
}
function html(it){
  if(it.k==="m"){var c=CATS[it.c];return '<div class="tag">'+c[0]+' '+c[1]+' · '+c[2]+' · '+c[3]+'</div><div class="en">'+esc(it.en)+'</div><div class="ar" dir="rtl">'+esc(it.ar)+'</div><div class="hi">'+esc(it.hi)+'</div>'}
  if(it.k==="q")return '<div class="qm">“</div><div class="en">'+esc(it.en)+'</div><div class="ar" dir="rtl">'+esc(it.ar)+'</div><div class="hi">'+esc(it.hi)+'</div><div class="by">— '+esc(it.by)+'</div>';
  if(it.k==="p")return '<div class="tag">From our archive · من الأرشيف</div><img src="'+it.src+'" alt=""><div class="by">'+esc(it.by)+'</div>';
  return '<div class="tag">📢 Announcements · إعلانات</div><ul>'+ANN.map(function(a){return '<li>'+esc(a[0])+'<small dir="rtl">'+esc(a[1])+'</small><small class="h">'+esc(a[2])+'</small></li>'}).join("")+'</ul>';
}
function show(){
  if(qi>=queue.length||qi<0){if(qi<0)qi=queue.length-1;else makeQueue()}
  var it=queue[qi],d=document.createElement("div");
  th=(th+1+Math.floor(Math.random()*2))%3;
  d.className="s th"+th+" fx"+Math.floor(Math.random()*3)+" "+it.k;
  d.innerHTML=html(it);stage.appendChild(d);
  void d.offsetWidth;d.classList.add("on");
  var old=curEl;if(old){old.classList.remove("on");setTimeout(function(){old.remove()},1000)}
  curEl=d;t0=Date.now();
}
function step(n){qi+=n;show()}
setInterval(function(){
  var p=Math.min((Date.now()-t0)/(SECONDS*1000),1);bar.style.width=(paused?0:p*100)+"%";
  if(p>=1&&!paused)step(1);
},100);
function tick(){document.getElementById("clock").innerHTML=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+"<br>"+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")step(1);
  else if(e.key==="ArrowLeft")step(-1);
  else if(e.key===" "){paused=!paused;t0=Date.now();e.preventDefault()}
  else if(e.key==="f"||e.key==="F"){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}
  else if(e.key==="p"||e.key==="P")document.getElementById("pick").click();
});
document.getElementById("pick").addEventListener("change",function(e){
  var files=Array.prototype.slice.call(e.target.files),n=0;
  files.forEach(function(f){var r=new FileReader();r.onload=function(){
    photos.push({src:r.result,name:f.name.replace(/\.[^.]+$/,"")});
    if(++n===files.length){rebuildPool();makeQueue();show()}};r.readAsDataURL(f)});
});
rebuildPool();makeQueue();show();
</script>
